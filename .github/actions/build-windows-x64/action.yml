name: Build Windows x64 Release
description: Restore, test and package the BSPLocalizationTools GUI and CLI.

outputs:
  archive-path:
    description: Absolute path to the Windows x64 7z archive.
    value: ${{ steps.package.outputs.archive-path }}

runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      shell: cmd
      run: dotnet restore BSPLocalizationTools.slnx

    - name: Test
      shell: cmd
      run: dotnet test BSPLocalizationTools.slnx -c Release --no-restore

    - name: Publish GUI (Native AOT)
      shell: cmd
      run: dotnet publish src\BSPLocalizationTools\BSPLocalizationTools.csproj -c Release -r win-x64 -o BSPLocalizationTools-Output\GUI

    - name: Publish CLI (Native AOT)
      shell: cmd
      run: dotnet publish src\BSPLocalizationToolsCLI\BSPLocalizationToolsCLI.csproj -c Release -r win-x64 -o BSPLocalizationTools-Output\CLI

    - name: Verify publish output
      shell: pwsh
      run: |
        # Native AOT discards PDBs; the release payload never ships them.
        Get-ChildItem -LiteralPath 'BSPLocalizationTools-Output' -Filter *.pdb -Recurse | Remove-Item -Force

        $cliDirectory = 'BSPLocalizationTools-Output\CLI'
        $cliFiles = @(Get-ChildItem -LiteralPath $cliDirectory -Recurse -File)
        if ($cliFiles.Count -ne 1 -or $cliFiles[0].Name -ne 'BSPLocalizationToolsCLI.exe') {
          throw 'CLI publish must contain exactly one self-contained executable.'
        }

        # Native AOT cannot fold Avalonia's native backends into the executable, and
        # satellite resource assemblies are still emitted for localized strings. The
        # set is exact: anything else means an unintended payload crept in.
        $exeName = 'BSPLocalizationTools.exe'
        $nativeDlls = @('av_libglesv2.dll', 'libSkiaSharp.dll', 'libHarfBuzzSharp.dll')
        $guiDirectory = 'BSPLocalizationTools-Output\GUI'
        $guiFiles = @(Get-ChildItem -LiteralPath $guiDirectory -Recurse -File)
        $unexpected = @($guiFiles | Where-Object {
          $_.Name -ne $exeName -and $nativeDlls -notcontains $_.Name -and
          $_.Name -ne 'BSPLocalizationTools.resources.dll'
        })
        if ($unexpected.Count -gt 0) {
          throw "GUI publish contains unexpected files: $($unexpected.Name -join ', ')"
        }
        if (!(Test-Path -LiteralPath (Join-Path $guiDirectory $exeName) -PathType Leaf)) {
          throw "GUI publish is missing its executable: $exeName"
        }
        foreach ($nativeDll in $nativeDlls) {
          if (!(Test-Path -LiteralPath (Join-Path $guiDirectory $nativeDll) -PathType Leaf)) {
            throw "GUI publish is missing its native backend library: $nativeDll"
          }
        }

    - name: Copy README to output
      shell: cmd
      run: copy README.md BSPLocalizationTools-Output\README.md /y

    - name: Package
      id: package
      shell: pwsh
      run: |
        $archiveDirectory = Join-Path $env:GITHUB_WORKSPACE 'build/artifacts'
        New-Item -ItemType Directory -Path $archiveDirectory -Force | Out-Null
        $archivePath = Join-Path $archiveDirectory 'BSPLocalizationTools-windows-x64.7z'
        if (Test-Path -LiteralPath $archivePath -PathType Leaf) {
          Remove-Item -LiteralPath $archivePath
        }
        & 7z a -t7z $archivePath 'BSPLocalizationTools-Output\*' -r '-x!*.pdb'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & 7z t $archivePath
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        if ((Get-Item -LiteralPath $archivePath).Length -eq 0) {
          throw "Missing or empty archive: $archivePath"
        }
        "archive-path=$archivePath" >> $env:GITHUB_OUTPUT
